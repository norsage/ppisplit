name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Check tag matches project version
        run: test "${GITHUB_REF_NAME#v}" = "$(uv version --short)"
      - name: Install MMseqs2
        run: |
          curl -fsSL https://mmseqs.com/latest/mmseqs-linux-avx2.tar.gz | tar xz
          echo "$PWD/mmseqs/bin" >> "$GITHUB_PATH"
      - run: uv sync --extra test
      - run: uv run pytest -q
      - run: uv build
      - name: Create release with wheel and sdist
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
