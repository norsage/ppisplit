[project]
name = "ppisplit"
version = "0.1.3"
description = "Sequence-aware cross-validation splitting and leak detection for protein-protein interaction datasets"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Georgii Sarapulov", email = "norsage@icloud.com" }]
keywords = ["protein-protein interaction", "data leakage", "cross-validation", "mmseqs2", "bioinformatics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.3.2",
    "numpy>=1.26",
    "gemmi>=0.7.3",
    "pyarrow>=15.0",
]

[project.urls]
Homepage = "https://github.com/norsage/ppisplit"
Issues = "https://github.com/norsage/ppisplit/issues"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ppisplit = "ppisplit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppisplit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
